apply plugin: 'com.android.application'
apply plugin: 'idea'

def hymnAppVersion = "v5.12.8"
def autoVersionCode = ((System.currentTimeMillis() - 1704067200000L) / 60000).toInteger()


allprojects {
    repositories {
        google()       // For Android libraries
        mavenCentral() // For general libraries
    }
}

android {
    namespace = 'com.lemuelinchrist.android.hymns'
    compileSdkVersion 36
//    buildToolsVersion "28.0.3"

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def keystorePath = keystoreProperties['storeFile']
                def keystoreFile = new File(keystorePath)
                if (!keystoreFile.isAbsolute()) {
                    keystoreFile = rootProject.file(keystorePath)
                }
                storeFile keystoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.lemuelinchrist.android.hymns"
        minSdkVersion 24    // Nougat (Play automatic protection needs 24+)
        targetSdkVersion 36
        // The version code is automatically generated based on the number of minutes since Jan 1, 2024.
        // This ensures that every build has a higher version code than the last, 
        // which is required to refresh the database cache of your phone.
        versionCode autoVersionCode
        versionName hymnAppVersion
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "HymnsForAndroid${hymnAppVersion}-PianoAndGuitar.apk"
        }
    }

    // Rename the AAB (App Bundle) output
    tasks.whenTaskAdded { task ->
        if (task.name == "bundleRelease") {
            task.doLast {
                def bundleFile = file("${buildDir}/outputs/bundle/release/app-release.aab")
                if (bundleFile.exists()) {
                    def newName = "HymnsForAndroid${hymnAppVersion}-PianoAndGuitar.aab"
                    bundleFile.renameTo(new File(bundleFile.parent, newName))
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0' // This library's latest stable version is still 1.0.0
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.11.0'   // WebViewAssetLoader for the new sheet music viewer

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'   // runs LogBook (which needs a Context) on the computer
    testImplementation 'androidx.test:core:1.6.1'
}

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError = false
        // a text the user sees belongs in strings.xml, so it can be translated
        error 'HardcodedText'
        // a missing translation shows in English: a warning, not a reason to stop a release
        warning 'MissingTranslation'
    }
    // the app's languages (values, values-b+zh+Hant, values-b+zh+Hans) for the phone's App languages setting
    androidResources {
        generateLocaleConfig = true
    }
}

// Make sure importSql runs before assembling the app
tasks.configureEach { task ->
    if (task.name.contains("assemble") || task.name.contains("compile") || task.name.contains("package")) {
        task.dependsOn(":sqlite:importSql")
    }
}

// SheetLyricsFilesTest reads the lyrics files: run it again when they change
tasks.withType(Test).configureEach {
    inputs.dir('src/main/assets/sheetLyrics')
}

// The sheet music viewer (assets/viewer) is the web app's sheet with its toolbar: the files of tools/web/src listed in
// tools/web/android/shared.txt, the page around them (tools/web/android) and music.js (tools/lead-sheet-editor),
// copied in at every build so the two apps run the same code. Verovio stays in src/main/assets/viewer.
def viewerAssets = file("$buildDir/generated/viewer-assets")
def copyViewer = tasks.register('copyViewer', Sync) {
    def web = rootProject.file('tools/web')
    def shared = new File(web, 'android/shared.txt').readLines()*.trim().findAll { it && !it.startsWith('#') }
    inputs.file(new File(web, 'android/shared.txt'))
    from(new File(web, 'src')) { include shared }
    from(new File(web, 'android')) { exclude 'shared.txt' }
    from(new File(web, 'vendor/piano')) { include '*.mp3'; into 'vendor/piano' }
    from(new File(web, 'vendor/guitar')) { include '*.mp3'; into 'vendor/guitar' }
    from(rootProject.file('tools/lead-sheet-editor/music.js'))
    into new File(viewerAssets, 'viewer')
}
android.sourceSets.main.assets.srcDirs += viewerAssets
tasks.configureEach { task ->
    if (task.name ==~ /(merge|package|generate|lintVital|lint|compress).*Assets.*/ || task.name ==~ /(?i).*lint.*/) {
        task.dependsOn(copyViewer)
    }
}
