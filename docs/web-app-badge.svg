<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="Hymns web app for iPhone, iPad and computers">
  <title>Hymns web app for iPhone, iPad and computers</title>
  <!-- like the store badges beside it: a black pill with a grey border, the app's icon (the serif H on dark grey), two lines.
       textLength keeps the text inside the pill whatever font the viewer has. -->
  <rect x="7.5" y="10.5" width="185" height="39" rx="6" fill="#000" stroke="#a6a6a6"/>
  <rect x="15" y="17" width="26" height="26" rx="6" fill="#404040"/>
  <text x="28" y="36.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="19" fill="#d6d6d6">H</text>
  <text x="49" y="26" textLength="131" lengthAdjust="spacingAndGlyphs" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.4" fill="#fff">FOR iPHONE, iPAD &amp; COMPUTERS</text>
  <text x="48.5" y="42.5" textLength="127" lengthAdjust="spacingAndGlyphs" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#fff">Hymns Web App</text>
</svg>
